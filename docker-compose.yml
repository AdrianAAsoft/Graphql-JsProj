
services:
  db:
    image: postgres:15   #this is the image from wich the container is creating
    container_name: postgres_db
    restart: always
    environment: #env values for when it creates the db in the docker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: Backend
    restart: always
    command: ["node", "--watch", "server/server.js"]
    ports:
      - "4000:4000"
    depends_on:
      - db
    volumes:
      - ./server:/app/server # live backend source from the host, nothing else
    environment:
      - dbhost=db
      - JWT_SECRET=${JWT_SECRET:-dev-only-change-me-in-production}

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    container_name: Frontend
    restart: always
    ports:
      - "5573:5573"
    depends_on:
      - app
    volumes:
      - .:/app            # live source from the host
      - /app/node_modules # keep the image's own node_modules
    environment:
      - VITE_API_URL=http://localhost:4000/graphql
      - CHOKIDAR_USEPOLLING=true # file-change events don't cross the Windows bind mount

volumes:
  db_data: